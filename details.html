
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details | Art Explorer</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Art Explorer</a>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">

    <div id="loading" class="text-center">
      Loading details...
    </div>

    <div id="error" class="alert alert-danger d-none"></div>

    <section id="details" class="row justify-content-center g-4 d-none">
      <div id="image-column" class="col-12">
        <img id="detail-image" class="img-fluid rounded" alt="">
      </div>

      <div class="col-12">
        <h1 id="detail-title" class="mb-3"></h1>
        <div id="detail-metadata" class="mb-4"></div>
        <div id="detail-description" class="mb-4"></div>

        <div class="detail-actions d-flex flex-wrap gap-2">
          <a id="back-to-search" href="index.html" class="btn btn-outline-primary">
            Back to Search
          </a>

          <button id="more-author-btn" class="btn btn-primary" type="button">
            More of this author
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-body-tertiary py-4 mt-auto">
    <div class="container text-center">
      <p class="text-muted mb-0">
        Artwork data provided by
        <a href="https://www.artic.edu/" target="_blank">
          the Art Institute of Chicago
        </a>
      </p>
    </div>
  </footer>

  <script type="module" src="details.js"></script>
</body>
</html>
