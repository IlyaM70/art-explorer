
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art Explorer</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        Art Explorer
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main  class="container my-5 flex-grow-1">

    <header class="text-center mb-5">
      <h1>Explore Art</h1>
      <p class="text-muted">
        Discover artworks and artists from the
        Art Institute of Chicago.
      </p>
    </header>

    <!-- Search -->
    <section aria-labelledby="search-heading">
      <h2 id="search-heading" class="h4 mb-3">
        Search Collection
      </h2>

      <form id="search-form">
        <div class="row g-3">

          <div class="col-md-3">
            <select
              id="search-type"
              class="form-select"
              aria-label="Search type"
            >
              <option value="artworks">Artworks</option>
              <option value="artists">Artists</option>
            </select>
          </div>

          <div class="col-md-7">
            <input
              type="search"
              id="search-input"
              class="form-control"
              placeholder="Enter artwork or artist name"
              aria-label="Search query"
              required
            >
          </div>

          <div class="col-md-2">
            <button
              type="submit"
              class="btn btn-primary w-100"
            >
              Search
            </button>
          </div>

        </div>
      </form>
    </section>

    <!-- Search Results -->
    <section class="mt-5" aria-labelledby="results-heading">
      <div class="container my-5">
        <div id="artworks-container"
            class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-body-tertiary py-4 mt-auto">
    <div class="container text-center">
      <p class="text-muted mb-0">
        Artwork data provided by the
        <a
          href="https://www.artic.edu/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Art Institute of Chicago
        </a>
      </p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script    
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Application JS -->
  <script type="module" src="app.js"></script>

</body>
</html>
