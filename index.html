
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Explorer</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Art Explorer</a>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <header class="text-center mb-5">
      <h1>Explore Art</h1>
      <p class="text-muted">
        Discover artworks and artists from the Art Institute of Chicago.
      </p>
    </header>

    <section>
      <h2 id="search-heading" class="h4 mb-3">Search Collection</h2>

      <form id="search-form">
        <div class="row g-3">
          <div class="col-md-3">
            <select id="search-type" class="form-select" aria-label="Search type">
              <option value="artworks">Artworks</option>
              <option value="artists">Artists</option>
            </select>
          </div>

          <div class="col-md-7">
            <input
              type="search"
              id="search-input"
              class="form-control"
              placeholder="Enter artwork or artist name"              
              required
            >
          </div>

          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">
              Search
            </button>
          </div>
        </div>
      </form>
    </section>

    <section class="mt-5">
      <div id="loading" class="text-center d-none">
        Loading results...
      </div>

      <div id="error" class="alert alert-danger d-none"></div>

      <div
        id="artworks-container"
        class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
      ></div>
    </section>

    <nav id="pagination" class="mt-4 d-none">
      <div class="d-flex justify-content-center align-items-center gap-3">
        <button id="prev-page" class="btn btn-outline-primary">
          Previous
        </button>

        <span id="page-info"></span>

        <button id="next-page" class="btn btn-outline-primary">
          Next
        </button>
      </div>
    </nav>
  </main>

  <footer class="bg-body-tertiary py-4 mt-auto">
    <div class="container text-center">
      <p class="text-muted mb-0">
        Artwork data provided by
        <a href="https://www.artic.edu/" target="_blank">
          the Art Institute of Chicago
        </a>
      </p>
    </div>
  </footer>

  <script type="module" src="index.js"></script>
</body>
</html>
